<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Danmarkskort</title>
</head>

<body>

    <div id="map"></div>
    <style>
        #map {
            width: 100%;
            height: 600px;
            background: #f5f2ed;
        }

        .city-marker {
            background: #e63946;
            border: 3px solid white;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
        }

        .city-tooltip {
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.4;
        }

        .city-tooltip strong {
            font-size: 16px;
        }
    </style>

    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script>

    // Opret et tomt kort
    const map = L.map('map', {
        zoomControl: false
    });


    // Indlæs Danmark fra GeoJSON
    fetch('map.geojson')
        .then(response => response.json())
        .then(data => {

            // Tegn Danmark
            const danmark = L.geoJSON(data, {
                style: {
                    fillColor: '#d9d6cf',
                    fillOpacity: 1,
                    color: '#d9d6cf',
                    weight: 1
                }
            }).addTo(map);


            // Zoom automatisk ind på Danmark
            map.fitBounds(danmark.getBounds());


            // Byerne
            const cities = [
                {
                    name: "Aarhus",
                    lat: 56.1629,
                    lon: 10.2039,
                    text: "Her ligger Aarhus."
                },
                {
                    name: "Aabenraa",
                    lat: 55.0443,
                    lon: 9.4174,
                    text: "Her ligger Aabenraa."
                },
                {
                    name: "Odense",
                    lat: 55.4038,
                    lon: 10.4024,
                    text: "Her ligger Odense."
                },
                {
                    name: "København",
                    lat: 55.6761,
                    lon: 12.5683,
                    text: "Her ligger København."
                },
                {
                    name: "Rønne",
                    lat: 55.1000,
                    lon: 14.7066,
                    text: "Her ligger Rønne på Bornholm."
                },
                {
                    name: "Gudhjem",
                    lat: 55.2100,
                    lon: 14.9710,
                    text: "Her ligger Gudhjem."
                },
                {
                    name: "Charlottenlund",
                    lat: 55.7525,
                    lon: 12.5760,
                    text: "Her ligger Charlottenlund."
                },
                {
                    name: "Roskilde",
                    lat: 55.6415,
                    lon: 12.0803,
                    text: "Her ligger Roskilde."
                }
            ];


            // Tilføj byerne
            cities.forEach(city => {

                const marker = L.circleMarker(
                    [city.lat, city.lon],
                    {
                        radius: 7,
                        fillColor: '#e63946',
                        color: '#ffffff',
                        weight: 2,
                        fillOpacity: 1
                    }
                ).addTo(map);


                // Tooltip ved hover
                marker.bindTooltip(
                    `<div class="city-tooltip">
                        <strong>${city.name}</strong><br>
                        ${city.text}
                    </div>`,
                    {
                        direction: 'top',
                        offset: [0, -8]
                    }
                );

            });

        });

</script>

</html>
