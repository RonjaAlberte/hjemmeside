<script>

const video = document.getElementById("hero-video");

window.addEventListener("scroll", () => {

    const scroll = window.scrollY;

    const fadeDistance = 500;

    const opacity = Math.max(
        0,
        1 - scroll / fadeDistance
    );

    video.style.opacity = opacity;

});

</script>
